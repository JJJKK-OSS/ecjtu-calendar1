name: 更新课表日历

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC；这里对应北京时间每天 03:23。
    - cron: "23 19 * * *"
  push:
    branches: [main]
    paths:
      - "config.mjs"
      - "scripts/**"
      - "shared/**"
      - "test/**"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 下载仓库
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 运行测试
        run: npm test

      - name: 读取教务课表并生成日历
        run: npm run generate
        env:
          ECJTU_WEIXIN_ID: ${{ secrets.ECJTU_WEIXIN_ID }}

      - name: 保存最新日历
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "自动更新课表日历"
          git pull --rebase origin main
          git push origin HEAD:main
